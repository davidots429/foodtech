[project]
name = "foodtech-business-api"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.120,<1", "uvicorn>=0.35,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodtech_business_api"]

