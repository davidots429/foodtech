[project]
name = "foodtech-standardization-worker"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.40,<2", "foodtech-contracts", "rfc8785>=0.1,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodtech_standardization_worker"]

[tool.uv.sources]
foodtech-contracts = { workspace = true }
