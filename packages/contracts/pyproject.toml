[project]
name = "foodtech-contracts"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.25,<5", "rfc8785>=0.1,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodtech_contracts"]
