name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMinimalDataFlow-dev --strict -c provisionDataFlow=true --output /tmp/foodtech-data-flow-cdk
        working-directory: infra/cdk
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAiImagePublishing-dev --strict -c provisionAiImagePublishing=true --output /tmp/foodtech-ai-image-cdk
        working-directory: infra/cdk
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAuthIdentity-dev --strict -c provisionIdentity=true -c customerCallback=http://127.0.0.1:8000/api/auth/customer/callback -c adminCallback=http://127.0.0.1:8000/api/auth/admin/callback -c customerWeb=http://127.0.0.1:5173 -c adminWeb=http://127.0.0.1:5174 -c cognitoDomainPrefix=foodtech-synthetic-test --output /tmp/foodtech-identity-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_cognito_rotation.py /tmp/foodtech-identity-cdk/FoodtechAuthIdentity-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCredentialVault-dev --strict -c provisionCredentialVault=true -c credentialKeyPeriod=2026-11 --output /tmp/foodtech-credential-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_gateway_policy.py /tmp/foodtech-credential-cdk/FoodtechCredentialVault-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechPrivacyStorage-dev --strict -c provisionPrivacyStorage=true --output /tmp/foodtech-privacy-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_privacy_storage.py /tmp/foodtech-privacy-cdk/FoodtechPrivacyStorage-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAiExecutionRegistry-dev --strict -c provisionAiExecutionRegistry=true --output /tmp/foodtech-ai-registry-retention-cdk > /dev/null
        working-directory: infra/cdk
      - run: python3 tests/config/check_ai_registry_retention.py /tmp/foodtech-ai-registry-retention-cdk/FoodtechAiExecutionRegistry-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCookingJobs-dev --strict -c provisionCookingJobs=true --output /tmp/foodtech-cooking-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_meal_refresh_index.py /tmp/foodtech-cooking-cdk/FoodtechCookingJobs-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMealRefreshSchedule-dev --strict -c provisionMealRefreshSchedule=true --output /tmp/foodtech-meal-schedule-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_meal_refresh_schedule.py /tmp/foodtech-meal-schedule-cdk/FoodtechMealRefreshSchedule-dev.template.json
      - name: Check matching principal mode in both AI tasks
        working-directory: infra/cdk
        run: |
          for mode in false true; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAiServiceTasks-dev --strict \
              -c provisionCredentialVault=true -c credentialKeyPeriod=2026-11 -c provisionAiServiceTasks=true \
              -c registrationImageRepository=foodtech/credential-registration -c registrationImageTag=synthetic-test \
              -c gatewayImageRepository=foodtech/ai-gateway -c gatewayImageTag=synthetic-test \
              -c registrationTlsSecretArn=arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:synthetic-registration-aaaaaa \
              -c gatewayTlsSecretArn=arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:synthetic-gateway-bbbbbb \
              -c credentialHmacVersion=synthetic-v1 -c principalProvisioningEnabled="$mode" \
              --output "/tmp/foodtech-ai-principal-$mode" > /dev/null
            python3 ../../tests/config/check_ai_principal_mode.py "/tmp/foodtech-ai-principal-$mode/FoodtechAiServiceTasks-dev.template.json" "$mode"
            python3 ../../tests/config/check_gateway_policy.py "/tmp/foodtech-ai-principal-$mode/FoodtechCredentialVault-dev.template.json"
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync python -c "from foodtech_business_api.main import app as business; from foodtech_ai_gateway.main import app as gateway; assert business.title and gateway.title"
      - run: uv run --no-sync python -m unittest discover -s apps/business-api/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/ai-gateway/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/credential-registration/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/capsule-crypto/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/collection-adapter/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/standardization-worker/tests -v
      - run: uv run --no-sync python -m unittest discover -s tests/security -v

  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore apps/mock-control/MockControl.csproj --locked-mode
      - run: dotnet build apps/mock-control/MockControl.csproj --no-restore --configuration Release

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: dotnet restore apps/mock-control/MockControl.csproj --locked-mode
      - run: dotnet build apps/mock-control/MockControl.csproj --no-restore --configuration Release
      - run: uv run --no-sync python -m unittest discover -s tests/integration -v

  ai-service-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [foodtech-ai-gateway, foodtech-credential-registration]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/ai-service.Dockerfile
          build-args: FOODTECH_PACKAGE=${{ matrix.package }}
          push: false
          load: true
          tags: foodtech-ci/${{ matrix.package }}:test
      - name: Verify service imports inside the runtime image
        run: |
          case '${{ matrix.package }}' in
            foodtech-ai-gateway) module=foodtech_ai_gateway.serve ;;
            foodtech-credential-registration) module=foodtech_credential_registration.serve ;;
          esac
          docker run --rm --entrypoint python foodtech-ci/${{ matrix.package }}:test -c "import importlib; importlib.import_module('$module')"

  mock-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/mock-control.Dockerfile
          push: false
          load: true
          tags: foodtech-ci/mock-control:test
      - name: Verify synthetic fixture hash
        run: docker run --rm foodtech-ci/mock-control:test hash --fixture fixtures/mockprofile-100-a-001.json | grep -Fx 'rec-a-001 f76cb5275bb85fc7c0c0da0309dc96cb5b64d29588d902cf28b6c5140e8d5ff2'

  collection-adapter-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/collection-adapter.Dockerfile
          push: false
          load: true
          tags: foodtech-ci/collection-adapter:test
      - name: Verify REST collection entrypoint
        run: docker run --rm foodtech-ci/collection-adapter:test --help
      - name: Verify MQTT collection entrypoint
        run: docker run --rm -e FOODTECH_COLLECTION_PROTOCOL=mqtt foodtech-ci/collection-adapter:test --help
      - name: Verify OPC UA JSON collection entrypoint
        run: docker run --rm -e FOODTECH_COLLECTION_PROTOCOL=opcua-json foodtech-ci/collection-adapter:test --help
      - name: Verify OPC UA Binary collection entrypoint
        run: docker run --rm -e FOODTECH_COLLECTION_PROTOCOL=opcua-binary foodtech-ci/collection-adapter:test --help


  combi-refresh-worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/combi-refresh-worker.Dockerfile
          push: false
          load: true
          tags: foodtech-ci/combi-refresh-worker:test
      - name: Verify worker imports and explicit configuration guard
        run: |
          docker run --rm --entrypoint python foodtech-ci/combi-refresh-worker:test -c 'import foodtech_business_api.combi_refresh_worker'
          status=0
          docker run --rm foodtech-ci/combi-refresh-worker:test || status=$?
          test "$status" -eq 2
