name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --experimental-transform-types tests/frontend/recipe-results.test.mjs
      - run: node --import tsx ../../tests/frontend/recipe-reviews.test.mjs
        working-directory: infra/cdk
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMinimalDataFlow-dev --strict -c provisionDataFlow=true --output /tmp/foodtech-data-flow-cdk
        working-directory: infra/cdk
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAiImagePublishing-dev --strict -c provisionAiImagePublishing=true --output /tmp/foodtech-ai-image-cdk
        working-directory: infra/cdk
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAuthIdentity-dev --strict -c provisionIdentity=true -c customerCallback=http://127.0.0.1:8000/api/auth/customer/callback -c adminCallback=http://127.0.0.1:8000/api/auth/admin/callback -c customerWeb=http://127.0.0.1:5173 -c adminWeb=http://127.0.0.1:5174 -c cognitoDomainPrefix=foodtech-synthetic-test --output /tmp/foodtech-identity-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_cognito_rotation.py /tmp/foodtech-identity-cdk/FoodtechAuthIdentity-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCredentialVault-dev --strict -c provisionCredentialVault=true -c credentialKeyPeriod=2026-11 --output /tmp/foodtech-credential-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_gateway_policy.py /tmp/foodtech-credential-cdk/FoodtechCredentialVault-dev.template.json
      - run: python3 tests/config/check_ai_auth_mutations.py /tmp/foodtech-credential-cdk/FoodtechCredentialVault-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechPrivacyStorage-dev --strict -c provisionPrivacyStorage=true --output /tmp/foodtech-privacy-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_privacy_storage.py /tmp/foodtech-privacy-cdk/FoodtechPrivacyStorage-dev.template.json
      - name: Check immutable collection task images
        run: python3 tests/config/check_collection_image.py
      - name: Check manual maintenance publishing roles
        working-directory: infra/cdk
        run: |
          for provider in false true; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMaintenancePublishing-dev --strict --no-lookups -c provisionMaintenancePublishing=true -c createGitHubOidcProvider="$provider" --output "/tmp/foodtech-maintenance-publish-$provider" > /dev/null
            if [ "$provider" = true ]; then
              python3 ../../tests/config/check_maintenance_publishing.py "/tmp/foodtech-maintenance-publish-$provider/FoodtechMaintenancePublishing-dev.template.json" --create-provider
            else
              python3 ../../tests/config/check_maintenance_publishing.py "/tmp/foodtech-maintenance-publish-$provider/FoodtechMaintenancePublishing-dev.template.json"
            fi
          done
      - name: Check manual collection publishing boundaries
        working-directory: infra/cdk
        run: |
          for mode in create existing; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCollectionPublishing-dev --strict --no-lookups -c provisionCollectionPublishing=true -c collectionImageRepositoryMode="$mode" --output "/tmp/foodtech-collection-publish-$mode" > /dev/null
            python3 ../../tests/config/check_collection_manual_publishing.py "/tmp/foodtech-collection-publish-$mode/FoodtechCollectionPublishing-dev.template.json" "$mode"
          done
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCollectionPublishing-dev --strict --no-lookups -c provisionCollectionPublishing=true -c provisionCollectionImagePublishing=true --output /tmp/foodtech-collection-double-publish > /tmp/foodtech-collection-double-publish.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'must not be selected together' in Path('/tmp/foodtech-collection-double-publish.log').read_text()"
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCollectionPublishing-dev --strict --no-lookups -c provisionCollectionPublishing=true -c collectionImageRepositoryMode=unknown --output /tmp/foodtech-collection-invalid-mode > /tmp/foodtech-collection-invalid-mode.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'collectionImageRepositoryMode must be create or existing' in Path('/tmp/foodtech-collection-invalid-mode.log').read_text()"
      - name: Check manual mock publishing boundaries
        working-directory: infra/cdk
        run: |
          for mode in create existing; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMockPublishing-dev --strict --no-lookups -c provisionMockPublishing=true -c mockImageRepositoryMode="$mode" --output "/tmp/foodtech-mock-publish-$mode" > /dev/null
            python3 ../../tests/config/check_mock_manual_publishing.py "/tmp/foodtech-mock-publish-$mode/FoodtechMockPublishing-dev.template.json" "$mode"
          done
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMockPublishing-dev --strict --no-lookups -c provisionMockPublishing=true -c mockImageRepositoryMode=unknown --output /tmp/foodtech-mock-invalid-mode > /tmp/foodtech-mock-invalid-mode.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'mockImageRepositoryMode must be create or existing' in Path('/tmp/foodtech-mock-invalid-mode.log').read_text()"
      - name: Check opt-in runtime foundation
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRuntimeFoundation-dev --strict --no-lookups -c provisionRuntimeFoundation=true -c runtimeEgressMode=nat --output /tmp/foodtech-runtime-foundation-cdk > /dev/null
          python3 ../../tests/config/check_runtime_foundation.py /tmp/foodtech-runtime-foundation-cdk/FoodtechRuntimeFoundation-dev.template.json
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRuntimeFoundation-dev --strict --no-lookups -c provisionRuntimeFoundation=true -c runtimeEgressMode=nat -c runtimeImageRepositoryMode=existing --output /tmp/foodtech-runtime-existing-image-cdk > /dev/null
          python3 ../../tests/config/check_runtime_foundation.py /tmp/foodtech-runtime-existing-image-cdk/FoodtechRuntimeFoundation-dev.template.json --existing-repository
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRuntimeFoundation-dev --strict --no-lookups -c provisionRuntimeFoundation=true -c runtimeEgressMode=nat -c runtimeImageRepositoryMode=unknown --output /tmp/foodtech-runtime-invalid-image-mode > /tmp/foodtech-runtime-image-rejected.log 2>&1; then
            echo 'Invalid repository ownership mode was accepted'
            exit 1
          fi
          python3 -c "from pathlib import Path; assert 'runtimeImageRepositoryMode must be create or existing' in Path('/tmp/foodtech-runtime-image-rejected.log').read_text()"
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRuntimeFoundation-dev --strict --no-lookups -c provisionRuntimeFoundation=true --output /tmp/foodtech-runtime-foundation-rejected > /tmp/foodtech-runtime-rejected.log 2>&1; then
            echo 'Missing billable-egress acknowledgement was accepted'
            exit 1
          fi
          python3 -c "from pathlib import Path; assert 'runtimeEgressMode=nat is required' in Path('/tmp/foodtech-runtime-rejected.log').read_text()"
      - name: Check separate private REST trial tasks and network
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechPrivateRestTrial-dev --strict --no-lookups -c provisionPrivateRestTrial=true --output /tmp/foodtech-private-rest-trial-cdk > /dev/null
          python3 ../../tests/config/check_private_rest_trial.py /tmp/foodtech-private-rest-trial-cdk/FoodtechPrivateRestTrial-dev.template.json
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRuntimeFoundation-dev --strict --no-lookups -c provisionRuntimeFoundation=true -c runtimeEgressMode=nat -c runtimeImageRepositoryMode=existing -c runtimeCollectionMode=private-rest-trial --output /tmp/foodtech-private-rest-network-cdk > /dev/null
          python3 ../../tests/config/check_runtime_foundation.py /tmp/foodtech-private-rest-network-cdk/FoodtechRuntimeFoundation-dev.template.json --existing-repository --private-rest-trial
      - name: Check empty private REST Secret stores
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechPrivateRestSecrets-dev --strict --no-lookups -c provisionPrivateRestSecrets=true --output /tmp/foodtech-private-rest-secrets-cdk > /dev/null
          python3 ../../tests/config/check_private_rest_secrets.py /tmp/foodtech-private-rest-secrets-cdk/FoodtechPrivateRestSecrets-dev.template.json
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechPrivateRestSecrets-prod --strict --no-lookups -c provisionPrivateRestSecrets=true -c stage=prod --output /tmp/foodtech-private-rest-secrets-rejected > /tmp/foodtech-private-rest-secrets-rejected.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'private REST Secrets require dev' in Path('/tmp/foodtech-private-rest-secrets-rejected.log').read_text()"
      - run: CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAiExecutionRegistry-dev --strict -c provisionAiExecutionRegistry=true --output /tmp/foodtech-ai-registry-retention-cdk > /dev/null
        working-directory: infra/cdk
      - run: python3 tests/config/check_ai_registry_retention.py /tmp/foodtech-ai-registry-retention-cdk/FoodtechAiExecutionRegistry-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCookingJobs-dev --strict -c provisionCookingJobs=true --output /tmp/foodtech-cooking-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_meal_refresh_index.py /tmp/foodtech-cooking-cdk/FoodtechCookingJobs-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMealRefreshSchedule-dev --strict -c provisionMealRefreshSchedule=true --output /tmp/foodtech-meal-schedule-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_meal_refresh_schedule.py /tmp/foodtech-meal-schedule-cdk/FoodtechMealRefreshSchedule-dev.template.json
      - run: CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMealRefreshSchedule-dev --strict -c provisionMealRefreshSchedule=true -c principalProvisioningEnabled=true --output /tmp/foodtech-meal-principal-cdk > /dev/null
        working-directory: infra/cdk
      - run: python3 tests/config/check_meal_refresh_schedule.py /tmp/foodtech-meal-principal-cdk/FoodtechMealRefreshSchedule-dev.template.json true
      - run: CDK_DEFAULT_ACCOUNT=573693340100 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechWithdrawalIdentitySchedule-dev --strict -c provisionWithdrawalIdentitySchedule=true --output /tmp/foodtech-withdrawal-identity-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_withdrawal_identity_schedule.py /tmp/foodtech-withdrawal-identity-cdk/FoodtechWithdrawalIdentitySchedule-dev.template.json
      - name: Check core-only Worker policy update mode
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMinimalDataFlow-dev --strict -c provisionDataFlow=true -c collectionInfrastructureMode=deferred --output /tmp/foodtech-worker-core-cdk > /dev/null
          python3 ../../tests/config/check_worker_core_mode.py /tmp/foodtech-worker-core-cdk/FoodtechMinimalDataFlow-dev.template.json
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMinimalDataFlow-dev --strict -c provisionDataFlow=true -c collectionInfrastructureMode=deferred -c provisionRestCollectionTask=true --output /tmp/foodtech-worker-core-rejected > /tmp/foodtech-worker-core-rejected.log 2>&1; then
            exit 1
          fi
          python3 -c "from pathlib import Path; assert 'collection tasks require collectionInfrastructureMode=create' in Path('/tmp/foodtech-worker-core-rejected.log').read_text()"
      - name: Check standardization agent execution access
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechStandardizationExecutionAccess-dev --strict -c provisionStandardizationExecutionAccess=true --output /tmp/foodtech-standardization-execution-cdk > /dev/null
          python3 ../../tests/config/check_standardization_execution_access.py /tmp/foodtech-standardization-execution-cdk/FoodtechStandardizationExecutionAccess-dev.template.json 123456789012
      - name: Check manual standardization runtime definition
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechStandardizationRuntime-dev --strict -c provisionStandardizationRuntime=true -c principalProvisioningEnabled=true -c standardizationTaskRoleArn=arn:aws:iam::123456789012:role/FoodtechMinimalDataFlow-dev-StandardizationWorkerTask-reviewed --output /tmp/foodtech-standardization-runtime-cdk > /dev/null
          python3 ../../tests/config/check_standardization_runtime.py /tmp/foodtech-standardization-runtime-cdk/FoodtechStandardizationRuntime-dev.template.json 123456789012
      - name: Check manual meal refresh registration
        working-directory: infra/cdk
        run: |
          python3 ../../tests/config/check_meal_refresh_targets.py
          for mode in create existing; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMealRefreshRuntime-dev --strict --no-lookups -c provisionMealRefreshRuntime=true -c principalProvisioningEnabled=true -c mealRefreshLogGroupMode="$mode" --output "/tmp/foodtech-meal-manual-$mode" > /dev/null
            python3 ../../tests/config/check_meal_refresh_runtime.py "/tmp/foodtech-meal-manual-$mode/FoodtechMealRefreshRuntime-dev.template.json" "$mode"
          done
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMealRefreshRuntime-dev FoodtechMealRefreshSchedule-dev --strict --no-lookups -c provisionMealRefreshRuntime=true -c provisionMealRefreshSchedule=true -c principalProvisioningEnabled=true -c mealRefreshLogGroupMode=existing --output /tmp/foodtech-meal-shared-logs > /dev/null
          python3 ../../tests/config/check_meal_refresh_runtime.py /tmp/foodtech-meal-shared-logs/FoodtechMealRefreshRuntime-dev.template.json existing
          python3 ../../tests/config/check_meal_refresh_schedule.py /tmp/foodtech-meal-shared-logs/FoodtechMealRefreshSchedule-dev.template.json true
          for rejection in strict stage collision logmode; do
            args='-c provisionMealRefreshRuntime=true -c principalProvisioningEnabled=true'
            case "$rejection" in
              strict) args='-c provisionMealRefreshRuntime=true'; expected='requires principalProvisioningEnabled=true' ;;
              stage) args="$args -c stage=prod"; expected='requires dev and an explicit verified account' ;;
              collision) args="$args -c provisionMealRefreshSchedule=true"; expected='must not both create the shared log group' ;;
              logmode) args="$args -c mealRefreshLogGroupMode=invalid"; expected='mealRefreshLogGroupMode must be create or existing' ;;
            esac
            if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth --strict --no-lookups $args --output "/tmp/foodtech-meal-rejected-$rejection" > "/tmp/foodtech-meal-rejected-$rejection.log" 2>&1; then exit 1; fi
            EXPECTED="$expected" REJECTION="$rejection" python3 -c "import os; from pathlib import Path; assert os.environ['EXPECTED'] in Path('/tmp/foodtech-meal-rejected-' + os.environ['REJECTION'] + '.log').read_text()"
          done
      - name: Check meal refresh role boundaries
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMealRefreshAccess-dev --strict --no-lookups -c provisionMealRefreshAccess=true --output /tmp/foodtech-meal-access-cdk > /dev/null
          python3 ../../tests/config/check_meal_refresh_access.py /tmp/foodtech-meal-access-cdk/FoodtechMealRefreshAccess-dev.template.json 123456789012
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechMealRefreshAccess-prod --strict --no-lookups -c provisionMealRefreshAccess=true -c stage=prod --output /tmp/foodtech-meal-access-prod > /tmp/foodtech-meal-access-prod.log 2>&1; then
            echo "Non-development meal refresh authority accepted"
            exit 1
          fi
          python3 -c "from pathlib import Path; assert 'meal refresh access requires dev' in Path('/tmp/foodtech-meal-access-prod.log').read_text()"
      - name: Check recipe source broker access
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRecipeSourceAccess-dev FoodtechRecipeSourceCatalog-dev --strict --no-lookups -c provisionRecipeSourceAccess=true -c provisionRecipeSourceCatalog=true --output /tmp/foodtech-recipe-source-access-cdk > /dev/null
          python3 ../../tests/config/check_recipe_source_access.py /tmp/foodtech-recipe-source-access-cdk/FoodtechRecipeSourceAccess-dev.template.json 123456789012
          python3 ../../tests/config/check_recipe_source_catalog.py /tmp/foodtech-recipe-source-access-cdk/FoodtechRecipeSourceCatalog-dev.template.json
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRecipeSourceAccess-dev --strict --no-lookups -c provisionRecipeSourceAccess=true -c recipeBrokerRoleMode=create --output /tmp/foodtech-recipe-owned-broker-cdk > /dev/null
          python3 ../../tests/config/check_recipe_source_access.py /tmp/foodtech-recipe-owned-broker-cdk/FoodtechRecipeSourceAccess-dev.template.json 123456789012 create
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRecipeSourceAccess-dev --strict --no-lookups -c provisionRecipeSourceAccess=true -c recipeBrokerRoleMode=unknown --output /tmp/foodtech-recipe-invalid-broker-cdk > /tmp/foodtech-recipe-invalid-broker.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'recipeBrokerRoleMode must be existing or create' in Path('/tmp/foodtech-recipe-invalid-broker.log').read_text()"
      - name: Check isolated combi source read access
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechCombiRecipeReadAccess-dev --strict --no-lookups -c provisionCombiRecipeReadAccess=true --output /tmp/foodtech-combi-read-access-cdk > /dev/null
          python3 ../../tests/config/check_combi_read_access.py /tmp/foodtech-combi-read-access-cdk/FoodtechCombiRecipeReadAccess-dev.template.json 123456789012
      - name: Check incremental recipe history access
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechRecipeHistoryAccess-dev --strict --no-lookups -c provisionRecipeHistoryAccess=true --output /tmp/foodtech-recipe-history-cdk > /dev/null
          python3 ../../tests/config/check_recipe_history_access.py /tmp/foodtech-recipe-history-cdk/FoodtechRecipeHistoryAccess-dev.template.json 123456789012
      - name: Check source grant deletion capability boundary
        working-directory: infra/cdk
        run: |
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechSourceGrantDeletionAccess-dev --strict --no-lookups -c provisionSourceGrantDeletionAccess=true --output /tmp/foodtech-source-grant-deletion-cdk > /dev/null
          python3 ../../tests/config/check_source_grant_deletion_access.py /tmp/foodtech-source-grant-deletion-cdk/FoodtechSourceGrantDeletionAccess-dev.template.json 123456789012
      - name: Check manual source grant runtime definition
        working-directory: infra/cdk
        run: |
          image="123456789012.dkr.ecr.ap-southeast-2.amazonaws.com/foodtech/maintenance-dev@sha256:$(printf 'a%.0s' {1..64})"
          for mode in create existing; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechSourceGrantRuntime-dev --strict --no-lookups -c provisionSourceGrantRuntime=true -c principalProvisioningEnabled=true -c sourceGrantImageUri="$image" -c sourceGrantTargetSubject=synthetic-source-grant-fixture -c sourceGrantLogGroupMode="$mode" --output "/tmp/foodtech-source-grant-runtime-$mode" > /dev/null
            python3 ../../tests/config/check_source_grant_runtime.py "/tmp/foodtech-source-grant-runtime-$mode/FoodtechSourceGrantRuntime-dev.template.json" 123456789012 "$mode"
          done
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechSourceGrantRuntime-dev --strict --no-lookups -c provisionSourceGrantRuntime=true -c sourceGrantImageUri="$image" --output /tmp/foodtech-source-grant-runtime-rejected > /tmp/foodtech-source-grant-runtime-rejected.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'source grant runtime requires principalProvisioningEnabled=true' in Path('/tmp/foodtech-source-grant-runtime-rejected.log').read_text()"
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechSourceGrantRuntime-dev --strict --no-lookups -c provisionSourceGrantRuntime=true -c principalProvisioningEnabled=true -c sourceGrantImageUri=123456789012.dkr.ecr.ap-southeast-2.amazonaws.com/foodtech/maintenance-dev:latest --output /tmp/foodtech-source-grant-runtime-mutable-rejected > /tmp/foodtech-source-grant-runtime-mutable-rejected.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'sourceGrantImageUri must be the reviewed immutable maintenance workload image' in Path('/tmp/foodtech-source-grant-runtime-mutable-rejected.log').read_text()"
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechSourceGrantRuntime-dev --strict --no-lookups -c provisionSourceGrantRuntime=true -c principalProvisioningEnabled=true -c sourceGrantImageUri="$image" --output /tmp/foodtech-source-grant-no-target > /tmp/foodtech-source-grant-no-target.log 2>&1; then exit 1; fi
          python3 -c "from pathlib import Path; assert 'sourceGrantTargetSubject must be an explicit valid reviewed subject' in Path('/tmp/foodtech-source-grant-no-target.log').read_text()"
      - name: Check manual identity role read probe
        working-directory: infra/cdk
        run: |
          for mode in create existing; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechWithdrawalIdentityProbe-dev --strict --no-lookups -c provisionWithdrawalIdentityProbe=true -c identityLogGroupMode="$mode" --output "/tmp/foodtech-identity-read-probe-$mode" > /dev/null
            if [ "$mode" = existing ]; then
              python3 ../../tests/config/check_withdrawal_identity_probe.py "/tmp/foodtech-identity-read-probe-$mode/FoodtechWithdrawalIdentityProbe-dev.template.json" --existing-logs
            else
              python3 ../../tests/config/check_withdrawal_identity_probe.py "/tmp/foodtech-identity-read-probe-$mode/FoodtechWithdrawalIdentityProbe-dev.template.json"
            fi
          done
          CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechWithdrawalIdentityProbe-dev FoodtechWithdrawalIdentitySchedule-dev --strict --no-lookups -c provisionWithdrawalIdentityProbe=true -c provisionWithdrawalIdentitySchedule=true -c identityLogGroupMode=existing --output /tmp/foodtech-identity-shared-logs > /dev/null
          python3 ../../tests/config/check_withdrawal_identity_probe.py /tmp/foodtech-identity-shared-logs/FoodtechWithdrawalIdentityProbe-dev.template.json --existing-logs
          python3 ../../tests/config/check_withdrawal_identity_schedule.py /tmp/foodtech-identity-shared-logs/FoodtechWithdrawalIdentitySchedule-dev.template.json
          if CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechWithdrawalIdentityProbe-dev --strict --no-lookups -c provisionWithdrawalIdentityProbe=true -c provisionWithdrawalIdentitySchedule=true --output /tmp/foodtech-identity-read-probe-collision > /tmp/foodtech-identity-probe-collision.log 2>&1; then
            echo 'Duplicate identity log ownership was accepted'
            exit 1
          fi
          python3 -c "from pathlib import Path; assert 'must not both create the shared log group' in Path('/tmp/foodtech-identity-probe-collision.log').read_text()"
      - run: CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechWithdrawalIdentityAccess-dev --strict -c provisionWithdrawalIdentityAccess=true --output /tmp/foodtech-withdrawal-identity-access-cdk
        working-directory: infra/cdk
      - run: python3 tests/config/check_withdrawal_identity_access.py /tmp/foodtech-withdrawal-identity-access-cdk/FoodtechWithdrawalIdentityAccess-dev.template.json
      - name: Check matching principal mode in both AI tasks
        working-directory: infra/cdk
        run: |
          for mode in false true; do
            CDK_DEFAULT_ACCOUNT=123456789012 npx cdk --app 'node --import tsx bin/app.ts' synth FoodtechAiServiceTasks-dev --strict \
              -c provisionCredentialVault=true -c credentialKeyPeriod=2026-11 -c provisionAiServiceTasks=true \
              -c registrationImageRepository=foodtech/credential-registration -c registrationImageDigest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              -c gatewayImageRepository=foodtech/ai-gateway -c gatewayImageDigest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
              -c registrationTlsSecretArn=arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:synthetic-registration-aaaaaa \
              -c gatewayTlsSecretArn=arn:aws:secretsmanager:ap-southeast-2:123456789012:secret:synthetic-gateway-bbbbbb \
              -c credentialHmacVersion=synthetic-v1 -c principalProvisioningEnabled="$mode" \
              --output "/tmp/foodtech-ai-principal-$mode" > /dev/null
            python3 ../../tests/config/check_ai_principal_mode.py "/tmp/foodtech-ai-principal-$mode/FoodtechAiServiceTasks-dev.template.json" "$mode"
            python3 ../../tests/config/check_gateway_policy.py "/tmp/foodtech-ai-principal-$mode/FoodtechCredentialVault-dev.template.json"
          done
      - name: Reject ambiguous AI service image inputs
        run: python3 tests/config/check_ai_task_images.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync python -m unittest discover -s tests/config -p test_maintenance_publish.py -v
      - run: uv run --no-sync python -m unittest discover -s tests/config -p test_collection_publish.py -v
      - run: uv run --no-sync python -m unittest discover -s tests/config -p test_mock_publish.py -v
      - run: uv run --no-sync python -m unittest discover -s tests/config -p test_worker_policy_update.py -v
      - run: uv run --no-sync python -c "from foodtech_business_api.main import app as business; from foodtech_ai_gateway.main import app as gateway; assert business.title and gateway.title"
      - run: uv run --no-sync python -m unittest discover -s apps/business-api/tests -v
      - run: uv run --no-sync python -m unittest discover -s packages/contracts/tests -p test_recipe_result_view.py -v
      - run: uv run --no-sync python -m unittest discover -s apps/ai-gateway/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/credential-registration/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/capsule-crypto/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/collection-adapter/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/standardization-worker/tests -v
      - run: uv run --no-sync python -m unittest discover -s tests/security -v

  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore apps/mock-control/MockControl.csproj --locked-mode
      - run: dotnet build apps/mock-control/MockControl.csproj --no-restore --configuration Release

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: dotnet restore apps/mock-control/MockControl.csproj --locked-mode
      - run: dotnet build apps/mock-control/MockControl.csproj --no-restore --configuration Release
      - run: uv run --no-sync python -m unittest discover -s tests/integration -v

  ai-service-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [foodtech-ai-gateway, foodtech-credential-registration]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/ai-service.Dockerfile
          build-args: FOODTECH_PACKAGE=${{ matrix.package }}
          push: false
          load: true
          tags: foodtech-ci/${{ matrix.package }}:test
      - name: Verify service imports inside the runtime image
        run: |
          case '${{ matrix.package }}' in
            foodtech-ai-gateway) module=foodtech_ai_gateway.serve ;;
            foodtech-credential-registration) module=foodtech_credential_registration.serve ;;
          esac
          docker run --rm --entrypoint python foodtech-ci/${{ matrix.package }}:test -c "import importlib; importlib.import_module('$module')"

  mock-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/mock-control.Dockerfile
          push: false
          load: true
          tags: foodtech-ci/mock-control:test
      - name: Verify synthetic fixture hash in isolated C# runtime
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e DOTNET_EnableDiagnostics=0 foodtech-ci/mock-control:test hash --fixture fixtures/mockprofile-100-a-001.json > "$RUNNER_TEMP/mock-hash.txt"
          grep -Fx 'rec-a-001 f76cb5275bb85fc7c0c0da0309dc96cb5b64d29588d902cf28b6c5140e8d5ff2' "$RUNNER_TEMP/mock-hash.txt"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint sh foodtech-ci/mock-control:test -c '. /etc/os-release; test "$ID" = ubuntu; test "$VERSION_ID" = 24.04'
          if docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e DOTNET_EnableDiagnostics=0 -e FOODTECH_MOCK_CLIENT_ID=synthetic-guard -e FOODTECH_MOCK_CLIENT_SECRET=synthetic-guard-value foodtech-ci/mock-control:test serve --fixture fixtures/rest-invalid-utf8-single-v1.json --certificate-source injected --max-runtime 0 --port 8443 > "$RUNNER_TEMP/mock-runtime-guard.txt" 2>&1; then
            echo 'Unbounded or invalid Mock runtime was accepted' >&2
            exit 1
          fi
          grep -F 'REST Mock --max-runtime must be 1 to 600 seconds.' "$RUNNER_TEMP/mock-runtime-guard.txt"

  collection-adapter-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/collection-adapter.Dockerfile
          push: false
          load: true
          tags: foodtech-ci/collection-adapter:test
      - name: Verify REST collection entrypoint
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges foodtech-ci/collection-adapter:test --help
      - name: Verify private REST trial module and writable CA volume
        run: bash infra/scripts/check_collection_trial_image.sh foodtech-ci/collection-adapter:test
      - name: Verify MQTT collection entrypoint
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e FOODTECH_COLLECTION_PROTOCOL=mqtt foodtech-ci/collection-adapter:test --help
      - name: Verify OPC UA JSON collection entrypoint
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e FOODTECH_COLLECTION_PROTOCOL=opcua-json foodtech-ci/collection-adapter:test --help
      - name: Verify OPC UA Binary collection entrypoint
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -e FOODTECH_COLLECTION_PROTOCOL=opcua-binary foodtech-ci/collection-adapter:test --help
      - name: Verify collection libzstd security floor
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python foodtech-ci/collection-adapter:test -c 'import subprocess; version = subprocess.check_output(["dpkg-query", "--show", "--showformat=${Version}", "libzstd1"], text=True).strip(); subprocess.run(["dpkg", "--compare-versions", version, "ge", "1.5.7+dfsg-1+deb13u1"], check=True)'


  combi-refresh-worker-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - workload: maintenance
            package: foodtech-business-api
          - workload: standardization
            package: foodtech-standardization-worker
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/containers/combi-refresh-worker.Dockerfile
          target: ${{ matrix.workload }}
          build-args: FOODTECH_PACKAGE=${{ matrix.package }}
          push: false
          load: true
          tags: foodtech-ci/combi-refresh-worker:test
      - name: Verify worker imports and explicit configuration guard
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python foodtech-ci/combi-refresh-worker:test -c 'import foodtech_business_api.combi_refresh_worker'
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges foodtech-ci/combi-refresh-worker:test || status=$?
          test "$status" -eq 2
      - name: Verify maintenance libzstd security update in the runtime image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python foodtech-ci/combi-refresh-worker:test -c 'import subprocess; version = subprocess.check_output(["dpkg-query", "--show", "--showformat=${Version}", "libzstd1"], text=True).strip(); subprocess.run(["dpkg", "--compare-versions", version, "ge", "1.5.7+dfsg-1+deb13u1"], check=True); print("Debian libzstd1 security floor verified")'
      - name: Verify separate identity worker command and configuration guard
        run: |
          docker run --rm --entrypoint python foodtech-ci/combi-refresh-worker:test -c 'import foodtech_business_api.withdrawal_identity_worker'
          status=0
          docker run --rm --entrypoint python foodtech-ci/combi-refresh-worker:test -m foodtech_business_api.withdrawal_identity_worker || status=$?
          test "$status" -eq 2
      - name: Verify read-only identity probe guard without network
        run: |
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python foodtech-ci/combi-refresh-worker:test -m foodtech_business_api.withdrawal_identity_probe || status=$?
          test "$status" -eq 2
      - name: Verify source grant deletion command stays disabled without configuration
        run: |
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python foodtech-ci/combi-refresh-worker:test -m foodtech_business_api.source_grant_deletion_worker || status=$?
          test "$status" -eq 2
      - name: Verify installed source grant target isolation without network
        if: matrix.workload == 'maintenance'
        run: docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python foodtech-ci/combi-refresh-worker:test - < tests/config/source_grant_target_image_probe.py
      - name: Verify installed meal refresh target dispatch without network
        if: matrix.workload == 'maintenance'
        run: docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python foodtech-ci/combi-refresh-worker:test - < tests/config/meal_refresh_target_image_probe.py
