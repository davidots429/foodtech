name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync python -c "from foodtech_business_api.main import app as business; from foodtech_ai_gateway.main import app as gateway; assert business.title and gateway.title"
      - run: uv run --no-sync python -m unittest discover -s apps/business-api/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/ai-gateway/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/collection-adapter/tests -v
      - run: uv run --no-sync python -m unittest discover -s apps/standardization-worker/tests -v

  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore apps/mock-control/MockControl.csproj --locked-mode
      - run: dotnet build apps/mock-control/MockControl.csproj --no-restore --configuration Release

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.17"
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: dotnet restore apps/mock-control/MockControl.csproj --locked-mode
      - run: dotnet build apps/mock-control/MockControl.csproj --no-restore --configuration Release
      - run: uv run --no-sync python -m unittest discover -s tests/integration -v

