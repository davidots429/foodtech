name: Publish Tonkatsu Gateway image

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect public OIDC claims, or publish the checked main commit
        required: true
        default: inspect
        type: choice
        options: [inspect, publish]
      expected_sha:
        description: Full reviewed main commit SHA required for publication
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: foodtech-tonkatsu-gateway-image
  cancel-in-progress: false

jobs:
  tonkatsu-gateway-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      PUBLISH_ROLE_ARN: ${{ vars.FOODTECH_TONKATSU_GATEWAY_PUBLISH_ROLE_ARN }}
      PUBLISH_ACCOUNT_ID: ${{ vars.FOODTECH_AWS_ACCOUNT_ID }}
      OPERATION: ${{ inputs.operation }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Require manual trusted main context
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = davidots429/foodtech
          test "$GITHUB_REF" = refs/heads/main
          test "$OPERATION" = inspect || test "$OPERATION" = publish
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect public OIDC claims without printing tokens
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 infra/scripts/tonkatsu_broker_publish.py inspect --service gateway --output "$RUNNER_TEMP/tonkatsu-gateway-oidc-inspection.json"
      - name: Record OIDC inspection
        uses: actions/upload-artifact@v7
        with:
          name: tonkatsu-gateway-oidc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tonkatsu-gateway-oidc-inspection.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate reviewed publishing target
        id: target
        if: inputs.operation == 'publish'
        run: python3 infra/scripts/tonkatsu_broker_publish.py target --service gateway
      - uses: docker/setup-buildx-action@v3
        if: inputs.operation == 'publish'
      - name: Build trusted source before obtaining AWS credentials
        uses: docker/build-push-action@v6
        if: inputs.operation == 'publish'
        with:
          context: .
          file: infra/containers/ai-service.Dockerfile
          build-args: FOODTECH_PACKAGE=foodtech-ai-gateway
          platforms: linux/amd64
          load: true
          push: false
          tags: foodtech-tonkatsu-gateway:${{ steps.target.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/davidots429/foodtech
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify Gateway entry point and private TLS volume before obtaining AWS credentials
        if: inputs.operation == 'publish'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "foodtech-tonkatsu-gateway:$TAG" \
            -c 'import pathlib, stat, tempfile; import foodtech_ai_gateway.serve_tonkatsu; import foodtech_ai_gateway.serve_tonkatsu_business; import foodtech_ai_gateway.serve_tonkatsu_inference; path = pathlib.Path("/run/foodtech-tls"); assert stat.S_IMODE(path.stat().st_mode) == 0o700; tempfile.TemporaryDirectory(dir=path).cleanup()'
      - name: Obtain short-lived Tonkatsu Gateway publishing credentials
        uses: aws-actions/configure-aws-credentials@v6.3.1
        if: inputs.operation == 'publish'
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ vars.FOODTECH_TONKATSU_GATEWAY_PUBLISH_ROLE_ARN }}
          allowed-account-ids: ${{ vars.FOODTECH_AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          role-session-name: tonkatsu-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
      - name: Verify reviewed repository before Docker login
        if: inputs.operation == 'publish'
        run: |
          aws ecr describe-repositories --repository-names foodtech/tonkatsu-gateway-dev --region "$AWS_REGION" --output json > "$RUNNER_TEMP/tonkatsu-gateway-repository.json"
          python3 infra/scripts/tonkatsu_broker_publish.py verify-repository --service gateway --input "$RUNNER_TEMP/tonkatsu-gateway-repository.json"
      - name: Publish immutable image and record registry digest
        if: inputs.operation == 'publish'
        env:
          REGISTRY: ${{ steps.target.outputs.registry }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/foodtech-tonkatsu-gateway-docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true; rm -f "$DOCKER_CONFIG/config.json"' EXIT
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "foodtech-tonkatsu-gateway:$TAG" "$REPOSITORY:$TAG"
          docker push "$REPOSITORY:$TAG"
          export IMAGE_DIGEST="$(aws ecr describe-images --repository-name foodtech/tonkatsu-gateway-dev --image-ids "imageTag=$TAG" --region "$AWS_REGION" --query 'imageDetails[0].imageDigest' --output text)"
          python3 infra/scripts/tonkatsu_broker_publish.py manifest --service gateway --output "$RUNNER_TEMP/tonkatsu-gateway-image-manifest.json"
      - name: Record immutable image manifest
        uses: actions/upload-artifact@v7
        if: inputs.operation == 'publish'
        with:
          name: tonkatsu-gateway-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tonkatsu-gateway-image-manifest.json
          if-no-files-found: error
          retention-days: 7
