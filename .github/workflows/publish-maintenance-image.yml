name: Publish maintenance image

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect OIDC claims, or explicitly publish the checked main commit
        required: true
        default: inspect
        type: choice
        options: [inspect, publish]

      workload:
        description: Explicit finite worker image to publish
        required: true
        default: maintenance
        type: choice
        options: [maintenance, standardization]

permissions:
  contents: read

concurrency:
  group: foodtech-maintenance-image
  cancel-in-progress: false

jobs:
  maintenance-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      PUBLISH_ROLE_ARN: ${{ vars.FOODTECH_MAINTENANCE_PUBLISH_ROLE_ARN }}
      PUBLISH_ACCOUNT_ID: ${{ vars.FOODTECH_AWS_ACCOUNT_ID }}
      OPERATION: ${{ inputs.operation }}
      IMAGE_WORKLOAD: ${{ inputs.workload }}
    steps:
      - name: Require manual trusted main context
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = davidots429/foodtech
          test "$GITHUB_REF" = refs/heads/main
          test "$OPERATION" = inspect || test "$OPERATION" = publish
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inspect public OIDC claims without printing tokens
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 infra/scripts/maintenance_publish.py inspect --output "$RUNNER_TEMP/maintenance-oidc-inspection.json"
      - name: Record OIDC inspection
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-oidc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-oidc-inspection.json
          if-no-files-found: error
          retention-days: 7
      - name: Validate reviewed publishing target
        id: target
        if: inputs.operation == 'publish'
        run: python3 infra/scripts/maintenance_publish.py target
      - uses: docker/setup-buildx-action@v3
        if: inputs.operation == 'publish'
      - name: Build trusted source before obtaining AWS credentials
        uses: docker/build-push-action@v6
        if: inputs.operation == 'publish'
        with:
          context: .
          file: infra/containers/combi-refresh-worker.Dockerfile
          target: ${{ steps.target.outputs.build_target }}
          build-args: FOODTECH_PACKAGE=${{ steps.target.outputs.package }}
          platforms: linux/amd64
          load: true
          push: false
          tags: foodtech-maintenance:${{ steps.target.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/davidots429/foodtech
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify disabled meal refresh before obtaining AWS credentials
        if: inputs.operation == 'publish'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          WORKLOAD: ${{ steps.target.outputs.workload }}
        run: |
          if [ "$WORKLOAD" = maintenance ]; then
            status=0
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "foodtech-maintenance:$TAG" -m foodtech_business_api.meal_refresh_runtime || status=$?
            test "$status" -eq 2
          fi
      - name: Verify disabled read probe before obtaining AWS credentials
        if: inputs.operation == 'publish'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          status=0
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "foodtech-maintenance:$TAG" -m foodtech_business_api.withdrawal_identity_probe || status=$?
          test "$status" -eq 2
      - name: Verify disabled source grant cleanup before obtaining AWS credentials
        if: inputs.operation == 'publish'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          WORKLOAD: ${{ steps.target.outputs.workload }}
        run: |
          if [ "$WORKLOAD" = maintenance ]; then
            status=0
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "foodtech-maintenance:$TAG" -m foodtech_business_api.source_grant_deletion_worker || status=$?
            test "$status" -eq 2
          fi
      - name: Verify source grant target isolation before obtaining AWS credentials
        if: inputs.operation == 'publish'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          WORKLOAD: ${{ steps.target.outputs.workload }}
        run: |
          if [ "$WORKLOAD" = maintenance ]; then
            docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "foodtech-maintenance:$TAG" - < tests/config/source_grant_target_image_probe.py
          fi
      - name: Verify disabled standardization runtime before obtaining AWS credentials
        if: inputs.operation == 'publish'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          WORKLOAD: ${{ steps.target.outputs.workload }}
        run: |
          if [ "$WORKLOAD" = standardization ]; then
            status=0
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "foodtech-maintenance:$TAG" -m foodtech_standardization_worker.runtime || status=$?
            test "$status" -eq 2
          fi
      - name: Verify patched maintenance library before obtaining AWS credentials
        if: inputs.operation == 'publish'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint python "foodtech-maintenance:$TAG" -c 'import subprocess; version = subprocess.check_output(["dpkg-query", "--show", "--showformat=${Version}", "libzstd1"], text=True).strip(); subprocess.run(["dpkg", "--compare-versions", version, "ge", "1.5.7+dfsg-1+deb13u1"], check=True); print("Debian libzstd1 security floor verified")'
      - name: Obtain short-lived publishing credentials
        uses: aws-actions/configure-aws-credentials@v6.3.1
        if: inputs.operation == 'publish'
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ vars.FOODTECH_MAINTENANCE_PUBLISH_ROLE_ARN }}
          allowed-account-ids: ${{ vars.FOODTECH_AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          role-session-name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
      - name: Publish immutable image and record registry digest
        if: inputs.operation == 'publish'
        env:
          REGISTRY: ${{ steps.target.outputs.registry }}
          REPOSITORY: ${{ steps.target.outputs.repository }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/foodtech-maintenance-docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout "$REGISTRY" >/dev/null 2>&1 || true; rm -f "$DOCKER_CONFIG/config.json"' EXIT
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "foodtech-maintenance:$TAG" "$REPOSITORY:$TAG"
          docker push "$REPOSITORY:$TAG"
          export IMAGE_DIGEST="$(aws ecr describe-images --repository-name foodtech/maintenance-dev --image-ids "imageTag=$TAG" --region "$AWS_REGION" --query 'imageDetails[0].imageDigest' --output text)"
          python3 infra/scripts/maintenance_publish.py manifest --output "$RUNNER_TEMP/maintenance-image-manifest.json"
      - name: Record immutable image manifest
        uses: actions/upload-artifact@v7
        if: inputs.operation == 'publish'
        with:
          name: maintenance-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-image-manifest.json
          if-no-files-found: error
          retention-days: 7
